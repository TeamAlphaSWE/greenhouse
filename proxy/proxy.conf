pid /home/greenhouse/app/proxy/run/nginx.pid;
error_log /home/greenhouse/app/proxy/run/error.log;

events {
    worker_connections 1024;
}

http {
    access_log /home/greenhouse/app/proxy/run/access.log;

    server {
        listen 127.0.0.1:15125;

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routes HTTP bridge's requests to the frontend
        location ^~ /_greenhouse_transport/ {
            access_log off;
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            client_max_body_size 24m;
        }

        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
