name: Test and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  frontend-tests:
    uses: ./.github/workflows/frontend-tests.yml

  validate-deploy-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment files
        run: |
          bash -n deploy/deploy.sh
          sh -n deploy/install-http-bridge.sh
          node --check frontend/http_transport.js

  deploy:
    needs: [backend-tests, frontend-tests, validate-deploy-files]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: greenhouse-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Transfer the tested commit and deploy
        shell: bash
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release_id="$(git rev-parse --short=7 HEAD)"
          full_sha="$(git rev-parse HEAD)"
          release_dir="releases/$release_id"
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$target" "mkdir -p '$release_dir' && python3 -" <<'PY'
          import shutil
          from pathlib import Path
          assert shutil.disk_usage(Path.home()).free >= 5 * 1024 * 1024, "Server disk is full; deployment stopped before copying files"
          PY
          # Extract into a fresh, versioned directory. Nothing is live until the symlink
          # swap below, so a bad archive or a failed extraction never touches the running app.
          # .env, .git, caches and other server-only files are never in this archive.
          git archive --format=tar HEAD | gzip -n | ssh -o BatchMode=yes "$target" "tar -xzf - -C '$release_dir'"
          ssh -o BatchMode=yes "$target" "
            set -euo pipefail
            echo '$full_sha' > '$release_dir/VERSION'
            ln -sf ~/config/.env '$release_dir/.env'
            ln -sf ~/config/gateway.env '$release_dir/greenhouse_gateway/.env'
            [ -L ~/app ] && readlink ~/app > ~/releases/previous || true
            ln -sfn \"\$HOME/$release_dir\" ~/app
            cd ~/app && bash deploy/deploy.sh
            ls -dt ~/releases/*/ | tail -n +6 | xargs -r rm -rf
          "
      - name: Verify public Streamlit rendering
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python deploy/check-public-frontend.py https://greenhouse.kentcs.org
      - name: Confirm the running version
        run: |
          running="$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'cat ~/app/VERSION')"
          echo "Server is running $running"
          test "$running" = "$(git rev-parse HEAD)"

  tag-release:
    needs: deploy
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          version=$(sed -n '1{s#^Release/\([0-9][0-9.]*\).*#\1#p}' <<< "${{ github.event.head_commit.message }}")
          : "${version:?Could not parse a version from the merge commit message}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
