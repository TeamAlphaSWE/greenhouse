name: Frontend tests

on:
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r frontend/requirements.txt
      - name: Test frontend
        run: python -m pytest frontend
